development: &common_settings
  cluster_name: "Aces"
  # ACES login node used for bounded quota inspections from portal hosts.
  # Grace and FASTER deployments can enable the same feature later by setting
  # this key to their internal login-node hostname; no application code change
  # is required.
  login_node: "alogin3.cluster"
  announcements_file: "var/announcements/announcements.json"
  dashboard_url: "/pun/dev/dor-hprc-HPCMosaic-dev"
  file_app_url: "/pun/sys/files/fs"
  file_editor_url: "/pun/sys/file-editor/edit"
  home_page: "https://hprc.tamu.edu"
  request_email: "help@hprc.tamu.edu"
  help_email: "help@hprc.tamu.edu"
  hprcbot_route: 'http://courant.hprc.tamu.edu:8553'
  dashboard_fonts:
    default: "inter"
    options:
      - key: "inter"
        label: "Inter"
        family: "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
      - key: "open-sans"
        label: "Open Sans"
        family: "\"Open Sans\", Arial, sans-serif"
      - key: "system"
        label: "System"
        family: "ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
      - key: "serif"
        label: "Serif"
        family: "Georgia, \"Times New Roman\", serif"

production:
  <<: *common_settings
  dashboard_url: "/pun/sys/dor-hprc-HPCMosaic-dev"
  announcements_file: "/var/www/ood/apps/sys/dor-hprc-HPCMosaic-dev/var/announcements/announcements.json"
  request_email: "help@hprc.tamu.edu"
  help_email: "help@hprc.tamu.edu"
